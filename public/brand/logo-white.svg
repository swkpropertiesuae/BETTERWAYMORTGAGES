  <title>Betterway Mortgages — Institutional Corporate Logo (dark)</title>
  <defs>
    
    <linearGradient id="bw-h-dark-em-stem" x1="88" y1="42" x2="175" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F9D7D"/>
      <stop offset="52%" stop-color="#13755C"/>
      <stop offset="100%" stop-color="#0A4B3B"/>
    </linearGradient>
    <linearGradient id="bw-h-dark-em-arch" x1="120" y1="168" x2="412" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F9D7D"/>
      <stop offset="58%" stop-color="#13755C"/>
      <stop offset="100%" stop-color="#0A4B3B"/>
    </linearGradient>
    <linearGradient id="bw-h-dark-em-facet" x1="94" y1="44" x2="148" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#35BFA0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#13755C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bw-h-dark-gold-ring" x1="158" y1="242" x2="414" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A67E2B"/>
      <stop offset="28%" stop-color="#D4AE52"/>
      <stop offset="58%" stop-color="#FBE9AE"/>
      <stop offset="82%" stop-color="#ECD186"/>
      <stop offset="100%" stop-color="#A67E2B"/>
    </linearGradient>
    <linearGradient id="bw-h-dark-gold-roof" x1="184" y1="224" x2="366" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBE9AE"/>
      <stop offset="48%" stop-color="#ECD186"/>
      <stop offset="100%" stop-color="#A67E2B"/>
    </linearGradient>
    <linearGradient id="bw-h-dark-gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECD186"/>
      <stop offset="50%" stop-color="#FBE9AE"/>
      <stop offset="100%" stop-color="#D4AE52"/>
    </linearGradient>
    <linearGradient id="bw-h-dark-crest-bg" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101D33"/>
      <stop offset="52%" stop-color="#0A1424"/>
      <stop offset="100%" stop-color="#060C18"/>
