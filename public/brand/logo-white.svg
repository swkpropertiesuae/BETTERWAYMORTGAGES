  <g transform="translate(-66.4, -14.4) scale(0.8)">
    
    <g id="bw-h-dark-mark">
      

      <!-- 1. Satin Brushed Champagne Gold Lower-Right Crescent Arc (Cleanly clipped between -18 deg and +128 deg) -->
      <path d="M 418.5 268.4
               A 154 154 0 0 1 177.2 437.4
               L 206.7 399.5
               A 106 106 0 0 0 372.8 283.2
               Z"
            fill="url(#bw-h-dark-gold-ring)"/>

      <!-- 2. Single Seamless Institutional Emerald Ascending Column + Upper Vault Arch (ZERO seam!) -->
      <path d="M 118 48
               L 153 65
               Q 166 72 166 88
               L 166 204.3
               A 154 154 0 0 1 418.5 268.4
               L 372.8 283.2
               A 106 106 0 0 0 166 316
               A 106 106 0 0 0 206.7 399.5
               L 177.2 437.4
               A 154 154 0 0 1 118 316
               Z"
            fill="url(#bw-h-dark-em-stem)"/>

      <!-- Subtle architectural highlight facet along outer left vertical spine -->
      <path d="M 118 48 L 138 58 L 138 316 C 138 355 151 389 175 416 L 157 424 C 132 394 118 357 118 316 Z"
            fill="url(#bw-h-dark-em-facet)"/>

      <!-- Delicate satin gold specular arc along the brushed gold lower-right ribbon -->
      <path d="M 192 426 A 141 141 0 0 0 407 284"
            stroke="#F8E9B8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.58"/>

      <!-- 3. Minimalist Swiss-Architectural Pitched Roofline + Open Monolithic Portal (ZERO chimney/dash/doorknob) -->
      <path d="M 190 314
               L 272 238
               L 354 314
               L 337 330
               L 272 270
               L 207 330
               Z"
            fill="url(#bw-h-dark-gold-roof)"/>

      <!-- Two clean monolithic structural piers framing an open architectural portal -->
      <path d="M 218 329 L 250 300 L 250 375 L 218 375 Z" fill="#FFFFFF" opacity="0.96"/>
      <path d="M 326 329 L 294 300 L 294 375 L 326 375 Z" fill="#FFFFFF" opacity="0.96"/>

      <!-- Clean gold architectural plinth anchoring the portal -->
      <rect x="208" y="375" width="128" height="7" rx="1.5" fill="url(#bw-h-dark-gold-roof)"/>
    </g>
    
  </g>
