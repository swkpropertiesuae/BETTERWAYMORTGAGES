<!doctype html>
<!-- Seamless 9s 1920x1080 Dubai Luxury Architectural Showreel driven by our newly generated 4K Dubai residences. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#080b0f}
.slide{position:absolute;inset:-48px;width:calc(100% + 96px);height:calc(100% + 96px);object-fit:cover;opacity:0}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,15,.16) 0%,rgba(11,17,23,.26) 55%,rgba(8,11,15,.55) 100%)}
.beam{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 70% 25%,rgba(215,177,88,.14),transparent 70%)}
</style></head><body>
<img id="a" class="slide" src="../../public/images/dubai-waterfront-3344.webp" alt="">
<img id="b" class="slide" src="../../public/images/marina-evening-2752.webp" alt="">
<img id="c" class="slide" src="../../public/images/footer-dubai-night-villa.webp" alt="">
<div class="veil"></div>
<div class="beam" id="beam"></div>
<script>
const slides = [document.getElementById('a'), document.getElementById('b'), document.getElementById('c')];
const T = 9;
const cl = (x) => Math.max(0, Math.min(1, x));
function render(t) {
  const cyc = (t % T);
  const segLen = T / 3; // 3s each with 0.7s smooth crossfade
  const fade = 0.75;
  slides.forEach((el, i) => {
    const start = i * segLen;
    let d = cyc - start;
    if (d < -T / 2) d += T;
    if (d > T / 2) d -= T;
    let op = 0;
    if (d >= -fade && d < 0) op = (d + fade) / fade;
    else if (d >= 0 && d < segLen - fade) op = 1;
    else if (d >= segLen - fade && d < segLen) op = 1 - (d - (segLen - fade)) / fade;
    el.style.opacity = cl(op);
    const localP = cl((d + fade) / (segLen + fade));
    const dir = i % 2 === 0 ? 1 : -1;
    el.style.transform = `scale(${1.02 + 0.06 * localP}) translate(${dir * (localP - 0.5) * 32}px, ${(0.5 - localP) * 14}px)`;
  });
  const ph = (cyc / T) * Math.PI * 2;
  document.getElementById('beam').style.opacity = 0.65 + 0.35 * Math.sin(ph);
}
window.render = render;
render(0);
</script></body></html>
